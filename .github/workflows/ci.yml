name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        # --frozen fails if uv.lock is out of sync with pyproject.toml,
        # so CI also verifies the lockfile is committed and current.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Format check
        # Fails if anything is unformatted. The pre-commit hook normally
        # prevents this from ever reaching CI; this is the backstop for
        # contributors who skipped hook installation.
        run: uv run ruff format --check app tests scripts

      - name: Migration graph has a single head
        run: uv run python scripts/check_single_head.py

      - name: Unit tests (SQLite)
        run: uv run pytest -v --cov=app --cov-report=term-missing

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drivenow
          POSTGRES_PASSWORD: drivenow
          POSTGRES_DB: drivenow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://drivenow:drivenow@localhost:5432/drivenow_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - run: uv sync --frozen

      - name: Apply migrations
        # Proves the migrations actually run against real PostgreSQL —
        # something the SQLite unit tests cannot verify.
        run: uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest -v -m integration

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t drivenow:ci .
